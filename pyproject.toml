[project]
name = "chat-bot"
version = "0.0.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["opendataloader-pdf"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "retrieval: hermetic retrieval-regression test using the real FastEmbed model (#19). Deselect with -m 'not retrieval'.",
]