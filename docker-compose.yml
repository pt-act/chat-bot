services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
      # Durable, retryable ingestion (#4): the API enqueues jobs; the worker processes them.
      - INGEST_MODE=queue
      - INGEST_INCOMING_DIR=/app/ingest_incoming
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ingest_incoming:/app/ingest_incoming
    networks:
      - app-network
    restart: unless-stopped

  # Durable ingest worker — consumes the Redis queue so ingestion survives API restarts.
  # Shares the Chroma store and the staged-upload volume with the API (same image).
  worker:
    build: .
    command: python -m ingest.worker
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - INGEST_MODE=queue
      - INGEST_INCOMING_DIR=/app/ingest_incoming
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ingest_incoming:/app/ingest_incoming
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Every write to Redis gets saved to a file on disk immediately. If the container restarts, Redis replays that file and recovers all data.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:
  ingest_incoming:

networks:
  app-network:
    driver: bridge
